name: Sophogram Build

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Gradle task — TAM YOL onerilir. Tum moduller (Huawei/HockeyApp/Standalone) agconnect-services.json olmadan derlenemez.'
        required: false
        default: ':TMessagesProj_App:assembleDebug'
      abi:
        description: 'ABI — arm64-v8a (gercek cihaz) veya all (4 ABI, yavas)'
        required: false
        default: 'arm64-v8a'
      inject_api:
        description: 'BuildVars.java icine TG_API_ID / TG_API_HASH gom'
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ inputs.variant }} / ${{ inputs.abi }}
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # NOT: android-actions/setup-android@v3 kullanilmiyor. Ic sdkmanager'da
      # kaldirilmis 'tools' paketini arayip hata veriyor ("Failed to find package
      # 'tools'"). Runner'da ANDROID_HOME ve cmdline-tools hazir gelir; elle kuruyoruz.
      - name: SDK / NDK / CMake kur
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER" || SDKMANAGER=$(command -v sdkmanager)
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: API kimliklerini yaz
        if: ${{ inputs.inject_api }}
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          set -euo pipefail
          if [ -z "${TG_API_ID}" || -z "${TG_API_HASH}" ]; then
            echo "::warning::TG_API_ID/TG_API_HASH secret tanimli degil — resmi genel anahtarlar kullanilacak (APP_ID=4)"
            exit 0
          fi
          python3 - <<'PY'
          import os, re, pathlib
          p = pathlib.Path("TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java")
          s = p.read_text(encoding="utf-8")
          s2 = re.sub(r'(public static int APP_ID = )\d+',
                      lambda m: m.group(1) + os.environ["TG_API_ID"], s)
          s2 = re.sub(r'(public static String APP_HASH = )"[^"]*"',
                      lambda m: m.group(1) + '"' + os.environ["TG_API_HASH"] + '"', s2)
          if s2 == s:
              print("::warning::BuildVars.java deseni eslesmedi, anahtarlar yazilmadi")
          else:
              p.write_text(s2, encoding="utf-8")
              print("BuildVars.java guncellendi")
          PY

      # ABI filtresi app modulunde (TMessagesProj_App/build.gradle) ZATEN tanimli:
      # productFlavors icinde her flavor'da 4 ABI listeleniyor. Yeni ndk{} blogu
      # eklemek degil, mevcut listeyi daraltmak gerekiyor. (TMessagesProj bir
      # library modul oldugu icin oraya ndk{} enjekte etmek hata veriyor.)
      - name: ABI listesini daralt
        run: |
          set -euo pipefail
          if [ "${{ inputs.abi }}" = "all" ]; then
            echo "ABI listesi degistirilmedi — 4 ABI derlenecek, yavas olabilir"
            exit 0
          fi
          python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path("TMessagesProj_App/build.gradle")
          s = p.read_text(encoding="utf-8")
          pattern = r'abiFilters\s+"armeabi-v7a"\s*,\s*"arm64-v8a"\s*,\s*"x86"\s*,\s*"x86_64"'
          found = len(re.findall(pattern, s))
          if found == 0:
              print("::warning::abiFilters deseni bulunamadi, build.gradle upstream degisti mi?")
          else:
              s2 = re.sub(pattern, 'abiFilters "${{ inputs.abi }}"', s)
              p.write_text(s2, encoding="utf-8")
              print(f"{found} abiFilters satiri daraltildi -> ${{ inputs.abi }}")
          PY

      - name: Derle
        run: |
          chmod +x gradlew
          ./gradlew ${{ inputs.variant }} --no-daemon --stacktrace --console=plain

      - name: APK ozeti
        if: always()
        run: |
          find TMessagesProj_App/build/outputs/apk -name '*.apk' -exec ls -lh {} \; 2>/dev/null || echo "APK bulunamadi"

      - uses: actions/upload-artifact@v4
        with:
          name: sophon-apk-${{ inputs.abi }}
          path: |
            TMessagesProj_App/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
